name: vanliessum

services:
  vanliessum:
    image: vanliessum:latest
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${PORT:-8798}:8080"
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/version.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
